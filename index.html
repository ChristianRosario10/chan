<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Relay Controller</title>
    <link rel="stylesheet" href="controller.css">
</head>
<body>
    <div class="container">
        <h1>ESP32 Relay Controller</h1>
        <div class="relay-controls">
            <div class="relay">
                <span>Relay 1</span>
                <label class="switch">
                    <input type="checkbox" id="relay1">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="relay">
                <span>Relay 2</span>
                <label class="switch">
                    <input type="checkbox" id="relay2">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="relay">
                <span>Relay 3</span>
                <label class="switch">
                    <input type="checkbox" id="relay3">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="relay">
                <span>Relay 4</span>
                <label class="switch">
                    <input type="checkbox" id="relay4">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <div id="status"></div>
    </div>
    <script src="controller.js"></script>
</body>
</html>
